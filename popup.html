<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>TEDUH APDL Fast Access</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="search-form">
    <input type="text" id="apdl-input" placeholder="APDL code (e.g. 30343-1)" autofocus>
    <button id="open-btn">Open</button>
  </div>

  <div id="status-msg"></div>

  <div id="project-info">
    <div class="project-header">
      <h2 id="project-name"></h2>
      <a id="teduh-link" class="open-teduh-link" href="#" target="_blank">Open in TEDUH &rarr;</a>
    </div>
    <div class="project-meta">
      <span id="project-code"></span>
      <span id="project-status"></span>
    </div>

    <div class="unit-counts">
      <div class="count-card total">
        <span class="count-value" id="total-units">-</span>
        <span class="count-label">Total</span>
      </div>
      <div class="count-card sold">
        <span class="count-value" id="sold-count">-</span>
        <span class="count-label">Sold</span>
      </div>
      <div class="count-card unsold">
        <span class="count-value" id="unsold-count">-</span>
        <span class="count-label">Unsold</span>
      </div>
    </div>

    <div id="newly-sold-section"></div>
  </div>

  <div id="recent-section">
    <h3>Recent <button id="clear-recent" class="clear-btn" title="Clear history">&times;</button></h3>
    <ul id="recent-list"></ul>
  </div>

  <div class="footer">
    <a href="https://teduh.kpkt.gov.my/" target="_blank">teduh.kpkt.gov.my</a>
  </div>

  <script src="popup.js"></script>
</body>

</html>
